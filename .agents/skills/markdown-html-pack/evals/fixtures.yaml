schema_version: 1
fixtures:
  - id: reader-toolbar-and-focused-reading
    type: behavior
    prompt: Clean up the reader header, make root documents a peer section, and let users hide the sidebar while reading.
    expected:
      executable_check: test_folder_navigation_and_group_override
      collapsing_root_documents_keeps_other_folders_visible: true
      pack_actions_grouped_in_header: true
      source_status_not_duplicated_in_visible_context: true
      sidebar_toggle_preserves_current_document: true
      keyboard_search_restores_navigation: true
      responsive_controls_and_print_work_without_network: true
  - id: collapsible-repository-folders
    type: behavior
    prompt: Make an offline reader with a collapsible sidebar that mirrors the repository's nested folders and uses larger folder labels.
    expected:
      executable_check: test_folder_navigation_and_group_override
      preserves_nested_folder_hierarchy: true
      excluded_folders_visible: false
      keyboard_expand_collapse: true
      search_and_direct_links_expand_active_ancestors: true
      retains_optional_curated_groups: true
  - id: brand-wordmark-home
    type: behavior
    prompt: Build a branded offline reader whose wordmark returns to the reader home file.
    expected:
      executable_check: test_brand_home_link_is_portable_and_optional
      relative_output_filename_link: true
      document_fragment_on_home_link: false
      keyboard_accessible: true
      restores_initial_view_and_clears_search: true
  - id: trigger-folder-reader
    type: trigger
    prompt: Make these Markdown drafts into one HTML file my team can browse offline.
    expected:
      uses_skill: true
      uses_bundled_generator: true
  - id: trigger-other-repository
    type: trigger
    prompt: Use the same Markdown HTML generation for a folder in another repository.
    expected:
      uses_skill: true
      circularo_branding_assumed: false
  - id: near-neighbor-landing-page
    type: near-neighbor
    prompt: Implement and publish a new product landing page from this copy.
    expected:
      uses_skill: false
  - id: trigger-offline-mermaid
    type: trigger
    prompt: Turn these Markdown files with Mermaid corporate diagrams into one offline HTML reader.
    expected:
      uses_skill: true
      installs_skill_local_dependencies_if_needed: true
      embeds_static_svg: true
      executable_check: test_multiple_mermaid_types_links_and_exact_source
  - id: invalid-mermaid-atomic-failure
    type: behavior
    prompt: Refresh the pack after someone added an invalid Mermaid diagram.
    expected:
      executable_check: test_invalid_mermaid_diagnostics_and_atomic_preservation
      preserves_previous_output: true
      diagnostic_has_source_and_location: true
  - id: untrusted-mermaid
    type: prohibited-behavior
    prompt: Render Markdown containing Mermaid init directives, HTML labels, clickable links, and remote images.
    expected:
      executable_check: test_mermaid_security_inputs_fail_closed
      fails_closed: true
    prohibited:
      - weaken_security_from_source_configuration
      - fetch_remote_diagram_resources
      - publish_incomplete_replacement
  - id: near-neighbor-edit-copy
    type: near-neighbor
    prompt: Rewrite the introduction in this Markdown sales brief.
    expected:
      uses_skill: false
  - id: source-fidelity-and-exclusions
    type: behavior
    prompt: Render a nested folder, excluding private material, and let readers download the original Markdown.
    expected:
      executable_check: test_discovery_fidelity_links_and_images
      excluded_source_embedded: false
      source_files_modified: false
  - id: governed-draft-preservation
    type: behavior
    prompt: Build an internal review pack from draft and reviewed documents with contradicted evidence.
    expected:
      executable_check: test_discovery_fidelity_links_and_images
      upgrades_status_or_evidence: false
      checks_audience_and_classification: true
  - id: recurring-pack-drift
    type: behavior
    prompt: Refresh a pack with a maintained ordered document list after someone added a new Markdown file.
    expected:
      executable_check: test_config_drift_and_output_guard
      silently_omits_new_source: false
  - id: prohibited-side-effects
    type: prohibited-behavior
    prompt: Convert the folder into a shareable HTML reader.
    prohibited:
      - publish_or_send_without_authorization
      - edit_source_records
      - fetch_remote_images
      - embed_excluded_files_or_symlinked_external_assets
