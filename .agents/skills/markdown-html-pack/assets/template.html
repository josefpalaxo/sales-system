<header class="topbar">

  <div class="search-control" data-js><label for="document-search">Search the documents</label><input id="document-search" type="search" placeholder="Search all __COUNT__ documents" autocomplete="off" spellcheck="false"></div>

</aside>

  <p class="sr-only" id="reader-context" role="status" aria-live="polite">__CONTEXT__</p>
  <noscript><p class="noscript-note">All documents are shown below. Use the contents menu or your browser's Find and Print commands.</p></noscript>

<script>
(() => {
  'use strict';
  const sources = JSON.parse(document.getElementById('source-data').textContent);
  const settings = JSON.parse(document.getElementById('pack-settings').textContent);
  const documents = Array.from(document.querySelectorAll('.document'));
  const navLinks = Array.from(document.querySelectorAll('.document-link'));
  const search = document.getElementById('document-search');
  const results = document.getElementById('search-results');
  const resultList = document.getElementById('result-list');
  const readerContext = document.getElementById('reader-context');
  const readAll = document.getElementById('read-all');
  const menu = document.querySelector('.menu-toggle');
  const sidebar = document.getElementById('document-sidebar');
  const mobile = matchMedia('(max-width: 760px)');
  const plain = Object.fromEntries(documents.map(doc => [doc.id, doc.querySelector('.doc-body').textContent.replace(/\s+/g, ' ').trim()]));
  let active = documents[0].id;
  let all = false;
  let noticeTimer;
  document.body.classList.add('enhanced');

  function announce(message) {
    clearTimeout(noticeTimer);
    document.getElementById('notice').textContent = message;
    noticeTimer = setTimeout(() => { document.getElementById('notice').textContent = ''; }, 3200);
  }
  function syncSidebar() {
    const open = mobile.matches ? document.body.classList.contains('menu-open') : !document.body.classList.contains('sidebar-collapsed');
    menu.setAttribute('aria-expanded', String(open));
    menu.textContent = mobile.matches ? (open ? 'Close browser' : 'Browse') : (open ? 'Hide sidebar' : 'Show sidebar');
  }
  function setSidebar(open) {
    if (mobile.matches) document.body.classList.toggle('menu-open', open);
    else document.body.classList.toggle('sidebar-collapsed', !open);
    syncSidebar();
    if (!open && sidebar.contains(document.activeElement)) menu.focus({preventScroll: true});
  }
  function closeMenu() {
    if (mobile.matches) setSidebar(false);
  }
  function setReadAllState(pressed) {
    readAll.setAttribute('aria-pressed', String(pressed));
    readAll.textContent = pressed ? 'Read one' : 'Read all';
  }
  function showDocument(id, {updateHash = true, scroll = true} = {}) {
    if (!sources[id]) return;
    active = id;
    all = false;
    search.value = '';
    results.hidden = true;
    documents.forEach(doc => { doc.hidden = doc.id !== id; });
    navLinks.forEach(link => {
      if (link.dataset.document === id) {
        link.setAttribute('aria-current', 'page');
        for (let folder = link.closest('.nav-group'); folder; folder = folder.parentElement.closest('.nav-group')) folder.open = true;
      }
      else link.removeAttribute('aria-current');
    });
    setReadAllState(false);
    readerContext.textContent = sources[id].label;
    document.title = sources[id].label + ' — ' + settings.title;
    closeMenu();
    if (updateHash) history.pushState(null, '', '#' + id);
    if (scroll) {
      window.scrollTo({top: 0, behavior: 'instant'});
      const title = document.getElementById(id).querySelector('h1') || document.getElementById(id);
      title.setAttribute('tabindex', '-1');
      title.focus({preventScroll: true});
    }
  }
  function followHash() {
    let hash;
    try { hash = decodeURIComponent(location.hash.slice(1)); } catch { hash = ''; }
    if (hash === 'read-all') { showAll(false); return; }
    const target = document.getElementById(hash);
    const article = target && (target.matches('.document') ? target : target.closest('.document'));
    if (article) {
      showDocument(article.id, {updateHash: false, scroll: false});
      if (target !== article) requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
      else window.scrollTo({top: 0, behavior: 'instant'});
    } else showDocument(active, {updateHash: false, scroll: false});
  }
  function showAll(updateHash = true) {
    search.value = '';
    all = true;
    results.hidden = true;
    documents.forEach(doc => { doc.hidden = false; });
    navLinks.forEach(link => link.removeAttribute('aria-current'));
    setReadAllState(true);
    readerContext.textContent = 'All ' + documents.length + ' documents' + (settings.edition ? ' · ' + settings.edition : '');
    document.title = settings.title + ' — All documents';
    closeMenu();
    if (updateHash) history.pushState(null, '', '#read-all');
    window.scrollTo({top: 0, behavior: 'instant'});
  }
  function addHighlighted(parent, text, query) {
    let offset = 0;
    const lower = text.toLowerCase();
    let index;
    while ((index = lower.indexOf(query, offset)) !== -1) {
      parent.append(document.createTextNode(text.slice(offset, index)));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(index, index + query.length);
      parent.append(mark);
      offset = index + query.length;
    }
    parent.append(document.createTextNode(text.slice(offset)));
  }
  function performSearch() {
    const query = search.value.trim().toLowerCase();
    if (!query) { showDocument(active, {updateHash: false, scroll: false}); return; }
    all = false;
    results.hidden = false;
    documents.forEach(doc => { doc.hidden = true; });
    navLinks.forEach(link => link.removeAttribute('aria-current'));
    setReadAllState(false);
    readerContext.textContent = 'Search across all ' + documents.length + ' documents';
    resultList.replaceChildren();
    const matches = documents.filter(doc => (sources[doc.id].label + ' ' + plain[doc.id]).toLowerCase().includes(query));
    document.getElementById('results-count').textContent = matches.length + (matches.length === 1 ? ' document matches' : ' documents match');
    if (!matches.length) {
      const li = document.createElement('li');
      li.className = 'empty-state';
      li.textContent = 'No documents match. Try a broader search term.';
      resultList.append(li);
    }
    matches.forEach(doc => {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + doc.id;
      link.dataset.document = doc.id;
      link.textContent = sources[doc.id].label;
      const snippet = document.createElement('p');
      const text = plain[doc.id];
      const index = text.toLowerCase().indexOf(query);
      const start = Math.max(0, index - 75);
      const end = Math.min(text.length, (index < 0 ? 0 : index) + 180);
      addHighlighted(snippet, (start ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : ''), query);
      li.append(link, snippet);
      resultList.append(li);
    });
  }
  document.addEventListener('click', async event => {
    const link = event.target.closest('a');
    if (link && link.dataset.document) {
      event.preventDefault();
      showDocument(link.dataset.document);
      return;
    }
    if (link && link.getAttribute('href')?.startsWith('#')) {
      const hash = link.getAttribute('href').slice(1);
      const target = document.getElementById(hash);
      const article = target && target.closest('.document');
      if (article) {
        event.preventDefault();
        if (!all || article.hidden) showDocument(article.id, {updateHash: false, scroll: false});
        history.pushState(null, '', '#' + hash);
        target.scrollIntoView({block: 'start'});
      }
    }
    const copy = event.target.closest('[data-copy]');
    const diagramCopy = event.target.closest('[data-diagram-copy]');
    if (copy || diagramCopy) {
      const button = copy || diagramCopy;
      const id = copy?.dataset.copy;
      const target = diagramCopy ? diagramCopy.closest('details').querySelector('code') : document.getElementById(id).querySelector('.doc-body');
      const text = diagramCopy ? target.textContent : target.innerText.trim();
      let success = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          success = true;
        }
      } catch {}
      if (!success) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.append(textarea);
        textarea.select();
        try { success = document.execCommand('copy'); } catch {}
        textarea.remove();
        button.focus({preventScroll: true});
      }
      if (success) {
        button.textContent = 'Copied';
        announce(diagramCopy ? 'Copied Mermaid source.' : 'Copied ' + sources[id].label.toLowerCase() + '.');
        setTimeout(() => { button.textContent = diagramCopy ? 'Copy diagram source' : 'Copy text'; }, 1800);
      } else {
        const range = document.createRange();
        range.selectNodeContents(target);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        announce('Text selected. Use your browser’s Copy command.');
      }
    }
    const download = event.target.closest('[data-download]');
    if (download) {
      const source = sources[download.dataset.download];
      const url = URL.createObjectURL(new Blob([source.markdown], {type: 'text/markdown;charset=utf-8'}));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = source.name.split('/').pop();
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      announce('Downloaded ' + source.name + '.');
    }
  });
  search.addEventListener('input', performSearch);
  document.getElementById('clear-search').addEventListener('click', () => {
    showDocument(active, {updateHash: false, scroll: false});
    search.focus();
  });
  readAll.addEventListener('click', () => { if (all) showDocument(active); else showAll(); });
  document.getElementById('print-pack').addEventListener('click', () => window.print());
  menu.addEventListener('click', () => {
    setSidebar(menu.getAttribute('aria-expanded') !== 'true');
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (mobile.matches && document.body.classList.contains('menu-open')) { closeMenu(); menu.focus(); }
      else if (search.value) { showDocument(active, {updateHash: false, scroll: false}); }
    }
    if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !/INPUT|TEXTAREA|SELECT/.test(event.target.tagName) && !event.target.isContentEditable) {
      event.preventDefault();
      setSidebar(true);
      search.focus();
    }
  });
  window.addEventListener('hashchange', followHash);
  window.addEventListener('popstate', followHash);
  mobile.addEventListener('change', syncSidebar);
  syncSidebar();
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(([entry]) => {
      document.documentElement.style.setProperty('--header-height', entry.target.getBoundingClientRect().height + 'px');
    }).observe(document.querySelector('.topbar'));
  }
  document.querySelectorAll('.nav-group[open]').forEach(folder => { folder.open = false; });
  followHash();
})();
</script>
</body>
</html>
