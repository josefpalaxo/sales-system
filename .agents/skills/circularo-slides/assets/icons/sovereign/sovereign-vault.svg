<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" role="img" aria-labelledby="title desc">
  <!--
    Sovereign Vault
    Represents evidence-grade archiving, immutable storage, retention policies, audit trails, and protected records.
    Designed for Circularo Sovereign Trust Platform slides using the approved purple/navy enterprise style.
  -->
  <title id="title">Sovereign Vault</title>
  <desc id="desc">Safe with shield check for protected archival storage.</desc>
  <defs>
    <linearGradient id="purple-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a18ff" />
      <stop offset="48%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#1d0090" />
    </linearGradient>
    <linearGradient id="soft-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="58%" stop-color="#eee8ff" />
      <stop offset="100%" stop-color="#cab8ff" />
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#1d0090" flood-opacity="0.16" />
    </filter>
  </defs>
  <g filter="url(#icon-shadow)">
    <rect x="12" y="18" width="114" height="120" rx="11" fill="url(#soft-fill)" stroke="#1d0090" stroke-width="5" />
    <rect x="28" y="34" width="84" height="85" rx="7" fill="#ffffff" stroke="#1d0090" stroke-width="4" />
    <path d="M24 58h-9M24 100h-9M126 58h-9M126 100h-9" stroke="#1d0090" stroke-width="5" stroke-linecap="round" />
    <circle cx="70" cy="76" r="27" fill="url(#purple-fill)" stroke="#1d0090" stroke-width="5" />
    <circle cx="70" cy="76" r="12" fill="#ffffff" opacity="0.9" />
    <path d="M70 48v13M70 91v13M42 76h13M85 76h13M50 56l9 9M81 87l9 9M90 56l-9 9M59 87l-9 9" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M128 84 166 100v28c0 24-15 40-38 50-23-10-38-26-38-50v-28z" fill="url(#purple-fill)" stroke="#ffffff" stroke-width="5" />
    <path d="M128 84 166 100v28c0 24-15 40-38 50-23-10-38-26-38-50v-28z" fill="none" stroke="#1d0090" stroke-width="4" />
    <path d="m111 127 12 12 27-32" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
