<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" role="img" aria-labelledby="title desc">
  <!--
    Sovereign Sign
    Represents legally binding digital signatures, approvals, document execution, audit trail, and compliance seals.
    Designed for Circularo Sovereign Trust Platform slides using the approved purple/navy enterprise style.
  -->
  <title id="title">Sovereign Sign</title>
  <desc id="desc">Signed document with approval badge and compliance seal.</desc>
  <defs>
    <linearGradient id="purple-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a18ff" />
      <stop offset="48%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#1d0090" />
    </linearGradient>
    <linearGradient id="soft-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="58%" stop-color="#eee8ff" />
      <stop offset="100%" stop-color="#cab8ff" />
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#1d0090" flood-opacity="0.16" />
    </filter>
  </defs>
  <g filter="url(#icon-shadow)">
    <path d="M28 8h82l34 34v100c0 10-8 18-18 18H28c-10 0-18-8-18-18V26c0-10 8-18 18-18z" fill="#ffffff" stroke="#1d0090" stroke-width="5" />
    <path d="M110 8v34h34z" fill="url(#soft-fill)" stroke="#1d0090" stroke-width="5" />
    <path d="M36 45h54M36 68h74M36 90h74M36 112h54" stroke="#9187d8" stroke-width="7" stroke-linecap="round" />
    <path d="M34 136c14-6 20-28 26-24 8 6-9 24 0 26 9 2 16-17 25-15 8 2 8 13 20 9" fill="none" stroke="#1d0090" stroke-width="5" stroke-linecap="round" />
    <path d="M112 105a37 37 0 1 1 0 74 37 37 0 0 1 0-74z" fill="url(#purple-fill)" stroke="#1d0090" stroke-width="5" />
    <path d="m94 141 14 14 28-35" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M93 172v-25h38v25l-19-10z" fill="url(#purple-fill)" stroke="#1d0090" stroke-width="4" />
  </g>
</svg>
