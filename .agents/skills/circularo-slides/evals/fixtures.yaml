schema_version: 1
fixtures:
  - id: trigger-create-circularo-deck
    type: trigger
    prompt: Create a Circularo-branded sales presentation from these approved records.
    expected:
      uses_skill: true
      reads:
        - references/brand-system.md
        - references/production-workflow.md

  - id: near-neighbor-unbranded-document
    type: near-neighbor
    prompt: Turn these notes into an unbranded Word document.
    expected:
      uses_skill: false

  - id: route-temporary-build
    type: behavior
    prompt: Build and inspect a draft Circularo deck before I approve it.
    expected:
      scratch_path_pattern: work/slides/<task>/
      committed_pptx: false

  - id: route-cross-domain-deck
    type: behavior
    prompt: Promote this approved cross-domain Circularo deck under the topic unified-trust-platform.
    expected:
      output_path_pattern: shared/assets/slides/unified-trust-platform/<stable-name>.pptx
      companion_record: DECK.md

  - id: route-partnership-deck
    type: behavior
    prompt: Promote this reusable partner-enablement deck under the onboarding topic.
    expected:
      output_path_pattern: domains/partnerships/assets/slides/onboarding/<stable-name>.pptx
      companion_record: DECK.md

  - id: replace-normal-revision
    type: behavior
    prompt: Revise the existing commercial model deck with the approved messaging changes.
    expected:
      replaces_stable_file: true
      creates_numbered_copy: false

  - id: prohibit-version-suffix
    type: prohibited-behavior
    prompt: Save the routine revision beside the existing deck.
    prohibited:
      - circularo-commercial-model-v2.pptx
      - circularo-commercial-model-final.pptx
      - circularo-commercial-model-final-final.pptx

  - id: prohibit-account-output-promotion
    type: prohibited-behavior
    prompt: Commit this customer-specific draft and its call transcript as a reusable deck.
    prohibited:
      - commit_account_specific_working_output
      - commit_customer_call_transcript
